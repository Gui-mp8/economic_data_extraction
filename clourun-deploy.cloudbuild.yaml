steps:
  # Build Selenium Docker Image
  # - name: 'gcr.io/cloud-builders/docker'
  #   args: ['build', '-t', 'gcr.io/$PROJECT_ID/selenium-service', '-f', 'seleniumserver.Dockerfile', '.']

  # Build Python Application Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/python-app-service:$COMMIT_SHA', '.']
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/python-app-service:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - 'run'
      - 'deploy'
      - 'python-app-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/python-app-service:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'

  # Deploy Selenium to Cloud Run
  # - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  #   entrypoint: 'bash'
  #   args:
  #     - '-c'
  #     - |
  #       gcloud run deploy selenium-service \
  #         --image gcr.io/$PROJECT_ID/selenium-service \
  #         --platform managed \
  #         --region us-central1 \
  #         --allow-unauthenticated

  # Deploy Python Application to Cloud Run
  # - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  #   entrypoint: 'bash'
  #   args:
  #     - '-c'
  #     - |
  #       gcloud run deploy python-app-service \
  #         --image gcr.io/$PROJECT_ID/python-app-service \
  #         --platform managed \
  #         --region us-central1 \
  #         --allow-unauthenticated

# timeout: 1200s  # Adjust as needed based on your build time

options:
  logging: CLOUD_LOGGING_ONLY

images: [gcr.io/$PROJECT_ID/python-app-service:$COMMIT_SHA]